# Plan morning-digest § 3 / § 4. The reviewer reads the digest from a copy (ADR 0003): this runs
# rig, saves /digest/2026-10-28 as one HTML file with a command, and deploys it to GitHub Pages
# as a build artifact. The preview is never committed. The marker comes from the LANE_MARKER
# secret; run with with_marker=false to upload the same page over the same link without it.
name: preview

on:
  workflow_dispatch:
    inputs:
      with_marker:
        description: "Put LANE_MARKER in the banner (false = clean-up run, banner reads 'no marker set')"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ inputs.with_marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          mkdir -p _site
          pnpm start > rig.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8787/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8787/digest/2026-10-28 -o _site/index.html
          grep -q '<table>' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
